<!DOCTYPE html>
<html lang="en">
<head>

  <title>Young Champz</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }

    header {
      background: #111;
      color: white;
      padding: 25px 15px;
    }

    h1 {
      margin: 0;
      font-size: 36px;
    }

    .hero {
      padding: 70px 20px;
      background: white;
    }

    .hero h2 {
      font-size: 30px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 25px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      background: #111;
      color: white;
    }

</head>

<body>

  <header>
    <h1>Young Champz</h1>

  <section class="hero">
    <h2>Welcome to Young Champz</h2>

    <a class="button" href="#">Get Started</a>

  <footer>
    © 2026 Young Champz. All rights reserved.
  </footer>

</html>
